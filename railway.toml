#:schema https://json.schemastore.org/non-existent.json
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile - core.wsgi:application"
healthcheckPath = "/health/"
# ملاحظة: إذا الـ Dockerfile حقك يسوي EXPOSE لـ 8000، ريلوي بتعرفه تلقائياً
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
DJANGO_SETTINGS_MODULE = "core.settings"