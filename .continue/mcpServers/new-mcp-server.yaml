name: Oda MCP Config
version: 0.0.1
schema: v1
mcpServers:
  # السيرفر الأول: إدارة ملفات مشروع Oda
  - name: filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "/home/osama-alhudhaif/Desktop/website/oda"

  # السيرفر الثاني: التحكم في موديلات Ollama محلياً
  - name: ollama
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-ollama"
    env:
      OLLAMA_URL: "http://localhost:11434"